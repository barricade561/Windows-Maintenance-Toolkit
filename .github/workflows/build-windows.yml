name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/WindowsMaintenanceToolkit/WindowsMaintenanceToolkit.csproj

      - name: Publish single-file EXE
        run: >-
          dotnet publish src/WindowsMaintenanceToolkit/WindowsMaintenanceToolkit.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = Get-Item publish/WindowsMaintenanceToolkit.exe
          if ($exe.Length -lt 1MB) { throw "Published executable is unexpectedly small." }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Maintenance-Toolkit-win-x64
          path: publish/WindowsMaintenanceToolkit.exe
          if-no-files-found: error
